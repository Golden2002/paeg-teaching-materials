<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学物料制作工作台</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1a1a1a; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --line:#e5e7eb;
    --ok:#10b981; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  header{text-align:center;margin-bottom:28px}
  header h1{font-size:26px;font-weight:700}
  header p{color:var(--muted);margin-top:6px;font-size:14px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-top:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db}
  .dot.on{background:var(--ok)}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .panel h2{font-size:15px;margin-bottom:14px;color:#374151}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:600}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;outline:none;transition:border .15s}
  input[type=text]:focus{border-color:var(--brand)}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .type-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left;transition:.15s}
  .type-btn:hover{border-color:var(--brand)}
  .type-btn.active{border-color:var(--brand);background:var(--brand-soft)}
  .type-btn .t{font-size:13px;font-weight:600}
  .type-btn .d{font-size:11px;color:var(--muted)}
  .btn{width:100%;margin-top:16px;padding:11px;border:none;border-radius:10px;background:var(--brand);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{opacity:.92}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:#374151}
  .out-area{min-height:420px}
  .placeholder{color:#c0c5cd;text-align:center;padding:80px 20px;font-size:14px}
  .spinner{margin:0 auto;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .md h1{font-size:20px;margin:0 0 12px}
  .md h2{font-size:16px;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);color:#2563eb}
  .md h3{font-size:14px;margin:14px 0 6px}
  .md p{margin:8px 0}
  .md ul,.md ol{margin:8px 0 8px 20px}
  .md li{margin:3px 0}
  .md code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:12.5px}
  .md pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow-x:auto;
    font-family:Consolas,monospace;font-size:12.5px;margin:10px 0;white-space:pre-wrap}
  .md pre code{background:none;color:inherit;padding:0}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
  .badge.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
  .badge.weak{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
  .toolbar{display:flex;gap:8px;margin-top:14px}
  .toolbar .btn{margin-top:0;width:auto;padding:8px 16px;font-size:13px}
  .qa{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;font-size:13px}
  .qa .pass{color:var(--ok);font-weight:600}
  .qa .fail{color:var(--err);font-weight:600}
  .qa ul{margin:6px 0 0 18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>教学物料制作工作台</h1>
    <p>输入主题与学科，一键生成 PPT 大纲 / 讲义 / 讲稿 / 思维导图 / 教学视频分镜 / Manim 数学动画</p>
    <div class="status"><span class="dot" id="llmDot"></span><span id="llmStatus">正在检测 LLM 连接…</span></div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>① 输入</h2>
      <label>教学主题（必填）</label>
      <input type="text" id="topic" placeholder="例如：一元二次方程、细胞呼吸、二次函数图像…">
      <label>学科（可选）</label>
      <input type="text" id="subject" placeholder="数学 / 物理 / 生物 / 通用…">

      <h2 style="margin-top:22px">② 选择物料类型</h2>
      <div class="types" id="types"></div>

      <button class="btn" id="genBtn" onclick="generate()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg> 生成物料</button>
    </div>

    <div class="panel out-area">
      <h2>③ 生成结果</h2>
      <div id="out"><div class="placeholder">选择物料类型并点击「生成物料」</div></div>
      <div class="toolbar" id="toolbar" style="display:none">
        <button class="btn ghost" onclick="checkQuality()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> 质量检查</button>
        <button class="btn ghost" onclick="copyOut()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> 复制</button>
        <button class="btn ghost" onclick="downloadOut()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载 .md</button>
      </div>
      <div class="qa" id="qa" style="display:none"></div>
    </div>
  </div>
</div>

<script>
const ICONS={
  zap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  presentation:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20 19a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2l-4 .998A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4a5 5 0 0 1 4 2 5 5 0 0 1 4-2z"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
  network:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>',
  clapper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
  film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
};
function ic(n,s){return (ICONS[n]||'').replace('viewBox','width="'+(s||14)+'" height="'+(s||14)+'" viewBox')}

const MATS=[
  {type:'ppt',icon:'presentation',label:'PPT 演示文稿',desc:'6x6 大纲'},
  {type:'handout',icon:'book',label:'讲义',desc:'6 段结构'},
  {type:'script',icon:'mic',label:'讲稿',desc:'分段 narration'},
  {type:'mindmap',icon:'network',label:'思维导图',desc:'层级结构'},
  {type:'video',icon:'clapper',label:'教学视频分镜',desc:'音画对齐'},
  {type:'manim',icon:'film',label:'Manim 动画',desc:'数学动画代码'},
];
let currentType='handout';
let lastResult=null;

const typesEl=document.getElementById('types');
MATS.forEach(m=>{
  const b=document.createElement('button');
  b.className='type-btn'+(m.type===currentType?' active':'');
  b.innerHTML=`<span class="t">${ic(m.icon,15)}${m.label}</span><span class="d">${m.desc}</span>`;
  b.onclick=()=>{currentType=m.type;renderTypes();};
  typesEl.appendChild(b);
});
function renderTypes(){
  [...typesEl.children].forEach((el,i)=>{
    el.className='type-btn'+(MATS[i].type===currentType?' active':'');
  });
}

// 健康检查
fetch('/api/health').then(r=>r.json()).then(d=>{
  const on=d.llm_available;
  document.getElementById('llmDot').className='dot'+(on?' on':'');
  document.getElementById('llmStatus').textContent=on?'LLM 已连接（DeepSeek）':'LLM 未连接（弱模式）';
}).catch(()=>{
  document.getElementById('llmStatus').textContent='后端未启动';
});

// 轻量 markdown 渲染
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md2html(src){
  if(!src) return '';
  const lines=src.split('\n');
  let html='',inCode=false,codeBuf=[];
  for(const line of lines){
    if(line.trim().startsWith('```')){
      if(inCode){html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>';codeBuf=[];}
      inCode=!inCode;continue;
    }
    if(inCode){codeBuf.push(line);continue;}
    if(/^###\s/.test(line)){html+='<h3>'+esc(line.replace(/^###\s/,''))+'</h3>';continue;}
    if(/^##\s/.test(line)){html+='<h2>'+esc(line.replace(/^##\s/,''))+'</h2>';continue;}
    if(/^#\s/.test(line)){html+='<h1>'+esc(line.replace(/^#\s/,''))+'</h1>';continue;}
    if(/^\s*[-*]\s/.test(line)){html+='<li>'+inline(line.replace(/^\s*[-*]\s/,''))+'</li>';continue;}
    if(/^\s*\d+[.)]\s/.test(line)){html+='<li>'+inline(line.replace(/^\s*\d+[.)]\s/,''))+'</li>';continue;}
    if(line.trim()===''){html+='';continue;}
    html+='<p>'+inline(line)+'</p>';
  }
  if(inCode&&codeBuf.length) html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>';
  // 合并连续 li 成 ul
  html=html.replace(/(<li>.*?<\/li>)(?=<li>)/gs,'$1').replace(/((?:<li>.*?<\/li>)+)/gs,'<ul>$1</ul>');
  return html;
}
function inline(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/`(.+?)`/g,'<code>$1</code>');
  return s;
}

async function generate(){
  const topic=document.getElementById('topic').value.trim();
  if(!topic){alert('请先输入教学主题');return;}
  const btn=document.getElementById('genBtn');
  btn.disabled=true;btn.textContent='生成中…';
  const out=document.getElementById('out');
  out.innerHTML='<div class="spinner"></div>';
  document.getElementById('toolbar').style.display='none';
  document.getElementById('qa').style.display='none';
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic,subject:document.getElementById('subject').value.trim(),material_type:currentType})});
    const d=await r.json();
    lastResult=d;
    const ok=d.ok&&d.output;
    const badge=ok?`<span class="badge ok">${ic('check',12)} 已生成（LLM）</span>`:'<span class="badge weak">弱模式占位（LLM 未连接）</span>';
    out.innerHTML=`<div class="badges">${badge}</div><div class="md">${md2html(d.output||d.error||'')}</div>`;
    document.getElementById('toolbar').style.display='flex';
  }catch(e){
    out.innerHTML=`<div class="placeholder">请求失败：${esc(String(e))}</div>`;
  }finally{
    btn.disabled=false;btn.innerHTML=ic('zap',14)+' 生成物料';
  }
}

async function checkQuality(){
  if(!lastResult||!lastResult.output) return;
  const qa=document.getElementById('qa');
  qa.style.display='block';qa.innerHTML='质量检查中…';
  try{
    const r=await fetch('/api/quality',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:lastResult.output,material_type:currentType})});
    const d=await r.json();
    if(d.ok){
      const pass=d.pass;
      qa.innerHTML=`<span class="${pass?'pass':'fail'}">${pass?ic('check',13)+' 结构检查通过':ic('x',13)+' 结构检查发现 '+d.issues.length+' 处问题'}</span>`
        +(d.issues&&d.issues.length?'<ul>'+d.issues.map(i=>'<li>'+esc(String(i))+'</li>').join('')+'</ul>':'');
    }else{
      qa.innerHTML='<span class="fail">质量检查失败：'+esc(d.error||'')+'</span>';
    }
  }catch(e){
    qa.innerHTML='<span class="fail">请求失败：'+esc(String(e))+'</span>';
  }
}

function copyOut(){
  if(!lastResult||!lastResult.output) return;
  navigator.clipboard.writeText(lastResult.output).then(()=>alert('已复制到剪贴板'));
}
function downloadOut(){
  if(!lastResult||!lastResult.output) return;
  const blob=new Blob([lastResult.output],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(document.getElementById('topic').value.trim()||'material')+'_'+currentType+'.md';
  a.click();URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
